<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguardando Confirmação</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="card centro">
            <div class="spinner" id="spinner"></div>
            <h2 id="titulo">Confirme no terminal</h2>
            <p id="msg" class="subtitulo">Siga as etapas no dispositivo.</p>
            <a href="./login.html" class="btn" id="voltar" hidden>Voltar ao login</a>
        </div>
    </div>

    <script>
        const id = new URLSearchParams(location.search).get("id");

        const mensagens = {
            negado:   "Acesso negado no terminal.",
            expirado: "O pedido expirou. Tente novamente.",
            bloqueado: "Muitas tentativas incorretas.",
            erro:     "O terminal desconectou durante o pedido.",
        };

        function finalizar(titulo, msg) {
            clearInterval(timer);
            document.getElementById("spinner").hidden = true;
            document.getElementById("titulo").textContent = titulo;
            document.getElementById("msg").textContent = msg;
            document.getElementById("voltar").hidden = false;
        }

        async function verificar() {
            try {
                const r = await fetch(`/api/login/${id}/status`);
                const { status } = await r.json();

                if (status === "aprovado") {
                    location.replace("./configuracoes.html");
                } else if (status !== "pendente") {
                    finalizar("Acesso não liberado", mensagens[status] ?? "Erro desconhecido.");
                }
            } catch {
                finalizar("Sem conexão", "Servidor indisponível.");
            }
        }

        const timer = setInterval(verificar, 1500);
        verificar();
    </script>
</body>
</html>
