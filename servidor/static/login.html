<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <form id="form-login" class="card">
        <h2>Entrar</h2>
        <p class="subtitulo">Sistema de gestão do laboratório</p>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Digite seu email"
                 autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="Digite sua senha"
                 autocomplete="current-password" required />
        </div>
        <button class="btn">Entrar</button>
        <p id="msg" class="msg"></p>
      </form>
    </div>

    <script>
      document.getElementById("form-login").onsubmit = async (e) => {
        e.preventDefault();
        const dados = Object.fromEntries(new FormData(e.target));
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados),
        });
        const resposta = await r.json();

        if (!r.ok) {
          document.getElementById("msg").textContent =
            resposta.detail ?? "Não foi possível entrar.";
          return;
        }
        location.replace(`./aguardando.html?id=${resposta.pedido_id}`);
      };
    </script>
  </body>
</html>
